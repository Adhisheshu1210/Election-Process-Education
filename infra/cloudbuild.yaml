# Google Cloud Build configuration
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/track1cloudrun/election-backend', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/track1cloudrun/election-frontend', './frontend']
images:
  - 'gcr.io/track1cloudrun/election-backend'
  - 'gcr.io/track1cloudrun/election-frontend'
